    });
  }

  /* Null means "not known yet", which is different from zero. */
  var myTwists = null;

  /* ---------- story details modal ---------- */

  /* Cast blurbs are written by the narrator in the STORY language. Each reader may
     have a different interface language, so there's no single translation to store —
     fetch it per reader, cache it, and fall back to the original on any failure. */
  var castT = {};
  function castKey(){ return (S ? S.code : "") + "|" + ui; }

  function castHtml(cast, translated){
    return cast.map(function(c, i){
      var who = (translated && translated[i]) || c.who;
      return "<b>"+esc(c.name)+"</b>"+(who?' <span style="color:var(--muted)">— '+esc(who)+'</span>':"");
    }).join("<br>");
  }

  async function ensureCastTranslated(){
    if(!S || !(S.cast||[]).length) return;
    var storyLang = (S.brief && S.brief.language) || "en";
    if(storyLang === ui) return;                 // same language, nothing to do
    var key = castKey();
    if(castT[key]) return;                       // already have it

    var whos = S.cast.map(function(c){ return c.who || ""; });
    if(!whos.some(Boolean)) return;
    try{
      // items/items, not texts/from/to: the Worker's shape, kept here by
      // accident after the move. The server derives the source language from
      // the story, which is also why it needs the code.
      var out = await api("/api/translate", { code: me.code, items: whos, ui: ui });
      if(out && Array.isArray(out.items) && out.items.length === whos.length){
        castT[key] = out.items;
        var el = $("castRows");
        if(el) el.innerHTML = castHtml(S.cast, castT[key]);
      }
    }catch(e){ /* leave the original text in place */ }
  }

  function openInfo(){
    if(!S) return;
    var p = PACING.filter(function(x){return x.id===(S.brief&&S.brief.pacing);})[0];
    var rows = [];

    rows.push([t("info.code"), '<b style="letter-spacing:.14em">'+esc(S.code)+'</b>']);
    var gs = (S.brief && S.brief.genres) || (S.brief && S.brief.genre ? [S.brief.genre] : []);
    if(gs.length) rows.push([t("info.genre"), gs.map(function(id){ return esc(tl("g",id,id)); }).join(" · ")]);
    if(S.brief&&S.brief.format) rows.push([t("info.written"), esc(tl("fmt",S.brief.format,S.formatLabel))]);
    if(S.languageLabel) rows.push([t("info.language"), esc(S.languageLabel)]);
    if(p) rows.push([t("info.pace"), esc(tl("p",p.id,p.label))+' <span style="color:var(--muted)">— '+esc(tl("ph",p.id,p.hint))+'</span>']);
    if(S.brief && S.brief.reading && S.brief.reading !== "any") rows.push([t("info.reading"), esc(tl("r",S.brief.reading,S.readingLabel))]);
    if((S.brief&&S.brief.objectives||[]).length) rows.push([t("info.learning"), S.brief.objectives.map(function(id,ix){ return esc(tl("o",id,(S.objectiveLabels||[])[ix]||id)); }).join("<br>")]);
    if((S.cast||[]).length){
      rows.push([t("info.cast"), '<span id="castRows">'+castHtml(S.cast, castT[castKey()])+'</span>']);
    }
    rows.push([t("info.players"), (S.players||[]).map(function(n){
      return esc(n) + (n===S.host?' <span style="color:var(--muted)">('+esc(t("info.host"))+')</span>':"");
    }).join("<br>")]);
    rows.push([t("info.lines"), String(S.lines||0)]);

    $("infoBody").innerHTML = rows.map(function(r){
      return '<div class="row"><div class="k">'+esc(r[0])+'</div><div class="v">'+r[1]+'</div></div>';
    }).join("");
    $("infoModal").classList.remove("hidden");
    ensureCastTranslated();
  }
  function closeInfo(){ $("infoModal").classList.add("hidden"); }

  $("infoBtn").addEventListener("click", openInfo);
  $("infoModal").querySelector(".back").addEventListener("click", closeInfo);
  $("infoModal").querySelector(".lx").addEventListener("click", closeInfo);

  /* The story menu's three bindings. They lived among the library code and were
     removed with it in the join-only surgery, which left the ⋮ circle drawn,
     styled, and completely inert — nothing errored, it just did nothing. */
  $("fab").addEventListener("click", openSheet);
  $("sheet").querySelector(".back").addEventListener("click", closeSheet);
  $("sheet").querySelector(".lx").addEventListener("click", closeSheet);

  function renderPlay(){
    if(!S) return;
    // The roster is the one panel that must track the story while it is open —
    // someone leaving is exactly what you opened it to find out.
    if(sheetView === "who" && !$("sheet").classList.contains("hidden")) openWho();
    $("codeBadge").textContent = S.code;
    $("dock").classList.toggle("hidden", !S.started);
    document.body.classList.toggle("playing", !!S.started);
    measureDock();

    var eb = $("endBanner");
    if(S.ended){ eb.textContent = "✦ " + t("end.done"); eb.classList.remove("hidden"); }
    else if(S.endIn){ eb.textContent = "⏳ " + t("end.in",{n:S.endIn}); eb.classList.remove("hidden"); }
    else eb.classList.add("hidden");


    // The cast lives in the ⓘ dialog — it updates as new characters appear.

    // Only surface the readability number when a level was actually targeted —
    // otherwise it's noise, and it invites reading meaning into a figure nobody asked for.
    var showGrade = !!(S.brief && S.brief.reading && S.brief.reading !== "any");

    var isScript = S.brief && (S.brief.format==="play" || S.brief.format==="screenplay");
    // non-Latin scripts need a different font stack and looser leading
    var latin = (S.languageLatin !== false);
    document.body.classList.toggle("cjk", !latin);

    $("story").innerHTML = (S.segments||[]).map(function(s,i){
      // Stable skin per passage — index-based, not random at render time, or the
      // colours would reshuffle every two seconds when polling repaints.
      var skin = s.isReversal ? "rev" : ("s" + (i % 5));
      var h='<div class="pcard '+skin+'">';
      if(s.isReversal) h+='<span class="revtag">&#9889; '+esc(t("play.reversal"))+'</span>';
      h+= (isScript && latin)
        ? '<div class="seg script">'+scriptHtml(s.text)+'</div>'
        : '<p class="seg'+(isScript?" script":"")+'">'+esc(s.text)+'</p>';
      var pill = (showGrade && s.grade!=null)
        ? '<span class="gradepill" title="Flesch–Kincaid">'+esc(t("play.grade",{n:s.grade}))+'</span>' : '';
      var read = OPTS.tts ? '<button class="readbtn" data-read="'+i+'" aria-label="'+esc(t("play.read"))+'">'+
        '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">'+
        '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'+
        '</svg>'+esc(t("play.read"))+'</button>' : '';
      if(s.by || pill || read){
        h+='<div class="byline">'+(s.by?esc(t("play.twistOf",{name:s.by})):"")+pill+read+'</div>';
      }
      if((s.craftNotes||[]).length){
        h+='<div class="craftbox">'+s.craftNotes.map(function(n){
          return '<div class="craft"><b>'+esc(n.objective)+'</b>'+esc(n.note)+'</div>';
        }).join("")+'</div>';
      }
      h+='</div>';   // close .pcard — the chapter break sits outside the card
      if(s.isChapterBreak && !s.isEnding) h+='<div class="chapter">'+esc(t("play.chapter"))+'</div>';
      if(s.isEnding) h+='<div class="theend">'+esc(t("end.done"))+'</div>';
      if(s.teaching && ((s.teaching.evidence||[]).length || (s.teaching.questions||[]).length)){
        h+='<div class="teachcard"><h4>'+esc((S.objectiveLabels||[]).join(" · ")||"Teaching notes")+'</h4>'+
          ((s.teaching.evidence||[]).length ? '<ul>'+s.teaching.evidence.map(function(e){return '<li>'+esc(e)+'</li>';}).join("")+'</ul>' : '')+
          ((s.teaching.questions||[]).length ? '<h4>'+esc(t("play.talk"))+'</h4><ul class="qs">'+s.teaching.questions.map(function(q){return '<li>'+esc(q)+'</li>';}).join("")+'</ul>' : '')+
          '</div>';
      }
      return h;
    }).join("");

    $("story").querySelectorAll("[data-read]").forEach(function(b){
      b.addEventListener("click", function(){ speak(parseInt(b.getAttribute("data-read"),10), b); });
    });

    var st="";
    if(S.busy) st='<div class="loading"><span class="orb"></span>'+esc(t("play.next"))+'</div>';
    else if(S.error) st='<div class="err"><span>'+esc(S.error)+'</span>'+(amHost()?'<button id="retryBtn">'+esc(t("c.retry"))+'</button>':'')+'</div>';
    $("status").innerHTML=st;
    var rb=$("retryBtn"); if(rb) rb.addEventListener("click", function(){ sendMove(""); });

    // host: whose turn next?
    var hb="", picking=false;
    if(amHost() && !S.busy && S.knot && !S.currentPlayer){
      picking=true;
      hb='<div class="hostbar"><div class="t">'+esc(t("play.waitPen",{name:S.host}))+'</div><div class="players">'+
        S.players.map(function(p,i){
          return '<span class="chip pick" data-p="'+esc(p)+'"><span class="dot" style="background:'+dotColour(i)+'"></span>'+esc(p)+' ▸</span>';
        }).join("")+
        '</div></div>';
    }
    $("hostBar").innerHTML=hb;
    $("hostBar").querySelectorAll("[data-p]").forEach(function(c){
      c.addEventListener("click", function(){ setTurn(c.getAttribute("data-p")); });
    });

    // the knot
    var myTurn = S.currentPlayer===me.name;
    if(S.knot && !S.busy && myTurn){
      var last=(S.segments||[])[S.segments.length-1];
      var kt={fork:"Fork",inject:"Inject",curveball:"Curveball"}[S.knotType]||"Fork";
      $("knotBox").innerHTML='<div class="knot"><div class="ktype">'+kt+'</div>'+
        '<p class="kq'+(last&&last.isReversal?" rev":"")+'">'+esc(S.knot.question)+'</p><div class="opts">'+
        (S.knot.options||[]).map(function(o,i){
          return '<button class="opt" data-o="'+i+'"><span class="d">&#9670;</span><span>'+esc(o)+'</span></button>';
        }).join("")+
        '</div><div class="wild"><input id="wildIn" placeholder="'+esc(t("play.wildPh"))+'"><button id="wildGo">'+esc(t("play.go"))+'</button></div></div>';
      $("knotBox").querySelectorAll("[data-o]").forEach(function(b){
        b.addEventListener("click",function(){ sendMove(S.knot.options[parseInt(b.getAttribute("data-o"),10)]); });
      });
      var wi=$("wildIn"),wg=$("wildGo");
      wg.addEventListener("click",function(){ var v=(wi.value||"").trim(); if(v) sendMove(v); });
      wi.addEventListener("keydown",function(e){ if(e.key==="Enter"){ var v=(wi.value||"").trim(); if(v) sendMove(v); }});
    } else if(S.knot && !S.busy && !picking && !libraryKey() && S.currentPlayer === me.name){
      // It IS your turn, and you have nothing to spend. Say so where the options
      // would have been, with the way out attached.
      $("knotBox").innerHTML =
        '<div class="waiting" style="text-align:left">'+
          '<b style="color:var(--twist)">'+esc(t("tw.readOnly"))+'</b><br>'+
          '<span style="font-size:13px">'+esc(t("tw.needKey"))+'</span>'+
        '</div>'+
        '<div class="mrow" style="margin-top:10px"><button id="twKeyOpen">'+
          esc(t("lib.manage"))+'</button></div>';
      $("twKeyOpen").addEventListener("click", openKeyPrompt);
    } else if(S.knot && !S.busy && !picking){
      $("knotBox").innerHTML='<div class="waiting">'+
        (S.currentPlayer ? "✏️ "+esc(t("play.hasPen",{name:S.currentPlayer})) : "🫖 "+esc(t("play.waitPen",{name:S.host})))+
        '</div>';
    } else $("knotBox").innerHTML="";
  }

  /* ---------- word / phrase lookup ---------- */

  var lastSel = null;

  function sentenceAround(node, term){
    // Give the model the sentence the word sits in — "bank" means something
    // different on a river than in a town.
    var full = (node && node.textContent) || "";
    var i = full.indexOf(term);
    if (i === -1) return full.slice(0, 400);
    var start = Math.max(0, full.lastIndexOf(".", i - 1) + 1);
    var endDot = full.indexOf(".", i + term.length);
    var end = endDot === -1 ? full.length : endDot + 1;
    return full.slice(start, end).trim().slice(0, 400);
  }

  function hideLookup(){
    $("lookBtn").classList.add("hidden");
    $("lookCard").classList.add("hidden");
  }

  function captureSelection(){
    var sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount === 0){ $("lookBtn").classList.add("hidden"); return false; }
    var text = String(sel.toString()||"").trim().replace(/\s+/g," ");
    var anchor = sel.anchorNode;
    var host = anchor && (anchor.nodeType===1 ? anchor : anchor.parentNode);
    if(!host || !$("story").contains(host)){ $("lookBtn").classList.add("hidden"); return false; }

    // Trim punctuation with a UNICODE-aware class. \w is [A-Za-z0-9_] only, so it
    // strips Japanese, Korean and Chinese away to nothing.
    var term = text.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
    if(!term){ $("lookBtn").classList.add("hidden"); return false; }

    // Decide by SCRIPT, not by spaces: an English word has no spaces either, so
    // a space test would call "beneath" a phrase.
    var cjk = /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uac00-\ud7af]/.test(term);
    // The ceiling is meant to exclude "explain this whole paragraph", not to
    // stop someone asking about a sentence — at 8 words it caught ordinary
    // clauses and the button just vanished, with nothing said. A sentence is
    // the unit people actually select, so the limit is set above one.
    var tooBig, isPhrase;
    if(cjk){
      tooBig   = term.length > 160;  // no word boundaries — measure characters
      isPhrase = term.length > 4;
    } else {
      var words = term.split(/\s+/).length;
      tooBig    = words > 30 || term.length > 400;
      isPhrase  = words > 1;
    }
    if(tooBig){ $("lookBtn").classList.add("hidden"); return false; }

    lastSel = { term: term, phrase: isPhrase, sentence: sentenceAround(host.closest(".seg")||host, text) };

    var r = sel.getRangeAt(0).getBoundingClientRect();
    if(!r || (!r.width && !r.height)){ $("lookBtn").classList.add("hidden"); return false; }
    var b = $("lookBtn");
    b.textContent = isPhrase ? t("look.many") : t("look.one",{w:term});
    b.style.left = Math.max(70, Math.min(window.innerWidth-70, r.left + r.width/2)) + window.scrollX + "px";
    b.style.top  = (r.top - 12 + window.scrollY) + "px";   // clear of the text it points at
    b.classList.remove("hidden");
    return true;
  }

  // Several triggers, because text selection is fiddly — especially on touch.
  document.addEventListener("selectionchange", captureSelection);
  document.addEventListener("mouseup", function(){ setTimeout(captureSelection, 0); });
  document.addEventListener("touchend", function(){ setTimeout(captureSelection, 60); }, {passive:true});

  // Double-click a word: skip the button entirely and look it up straight away.
  $("story").addEventListener("dblclick", function(){
    setTimeout(function(){ if(captureSelection()) doLookup(); }, 0);
  });

  function cardShell(inner){
    var card = $("lookCard");
    card.innerHTML = '<button class="lx">&times;</button>'+inner;
    card.classList.remove("hidden");
    card.querySelector(".lx").addEventListener("click", hideLookup);
    return card;
  }

  async function doLookup(){
    if(!lastSel || !lastSel.term) return;
    var term = lastSel.term, sentence = lastSel.sentence;
    $("lookBtn").classList.add("hidden");
    // Drop the selection so the trailing mouseup/selectionchange doesn't
    // immediately pop the button back up over the result card.
    try{ var s0 = window.getSelection(); if(s0) s0.removeAllRanges(); }catch(e){}
    cardShell('<div class="loading" style="padding:0"><span class="orb"></span>'+esc(t("look.looking",{w:term}))+'</div>');

    var out;
    try{
      out = await api("/api/define", {
        // The server reads the story to pitch the explanation at its reading
        // band, so the code is required. The Worker took it from the URL; the
        // Edge Function takes it from the body, and this call was missed.
        code: me.code,
        term: term, sentence: sentence, phrase: !!lastSel.phrase,
        reading: (S && S.brief && S.brief.reading) || "any",
        language: (S && S.brief && S.brief.language) || "en",
        ui: ui
      });
    }catch(e){
      console.error("[lookup]", e);
      cardShell('<div class="err" style="padding:0"><span>'+esc(e.message||"Lookup failed.")+'</span></div>');
      return;
    }

    if(!out || !out.meaning){
      cardShell('<div class="err" style="padding:0"><span>'+esc(t("look.none"))+'</span></div>');
      return;
    }

    cardShell(
      '<div class="lt">'+esc(out.term||term)+(out.pos?'<span class="pos">'+esc(out.pos)+'</span>':'')+'</div>'+
      '<p class="lm">'+esc(out.meaning)+'</p>'+
      (out.simpler?'<div class="ls">'+esc(t("look.simpler"))+' <b>'+esc(out.simpler)+'</b></div>':'')
    );
  }

  // Fire on POINTERDOWN, not click. A click needs a clean down→up pair on the same
  // spot; because the button sits flush against the selected text, the browser was
  // eating that pair near the top edge. Pressing is enough.
  var lookBusy = false;
  function triggerLookup(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(lookBusy) return;
    lookBusy = true;
    doLookup().finally(function(){ setTimeout(function(){ lookBusy = false; }, 400); });
  }
  $("lookBtn").addEventListener("pointerdown", triggerLookup);
  $("lookBtn").addEventListener("mousedown", function(e){ e.preventDefault(); });
  // Fallback for anything without pointer events.
  $("lookBtn").addEventListener("click", function(e){
    if(!window.PointerEvent) triggerLookup(e);
  });

  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ hideLookup(); closeInfo(); closeSheet(); } });
  window.addEventListener("scroll", function(){ $("lookBtn").classList.add("hidden"); }, {passive:true});
  window.addEventListener("resize", measureDock);
  if(window.ResizeObserver) new ResizeObserver(measureDock).observe($("dock"));

  /* A shared link carries the code, so a browser player has one thing to get
     right (their name) instead of two. The code is still shown and can still be
     typed — this only saves the typing. */
  (function prefillFromLink(){
    var m = /[?&]c=([A-Za-z0-9]{4})\b/.exec(window.location.search);
    if(!m) return;
    var code = m[1].toUpperCase();
    if(!/^[2-9BCDFGHJKMNPQRSTVWXYZ]{4}$/.test(code)) return;
    $("joinCode").value = code;
    // Straight to the join screen if we already know who they are; otherwise
    // home first, because a nickname is required before joining.
    if(($("nameIn").value||"").trim()) { me.name = $("nameIn").value.trim(); show("join"); }
  })();

  // A refresh should not ask again: sessionStorage outlives the reload.
  if(!keyPrefillDone){
    keyPrefillDone = true;
    var k0 = libraryKey();
    if(k0) $("keyIn").value = k0.replace(/(.{4})(?=.)/g, "$1-");
  }

  loadOptions();        // read-aloud availability; failure just leaves it off
  $("footYear").textContent = new Date().getFullYear();
  setUi(pickDefaultUi());
  applyUi();
})();
</script>
</body>
</html>
