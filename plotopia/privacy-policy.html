<h1>Privacy Policy</h1>
<p class="lead">Capy’s Plotopia · last updated 4 August 2026</p>

<div class="note">
  <p><b>The short version.</b> There are no accounts. We never ask for your name,
  your email, or your child’s age. We do not show ads, we do not use analytics or
  tracking, and we do not sell or share anything with anyone for advertising.</p>
</div>

<h2>Who we are</h2>
<p>Capy’s Plotopia is made by PXT Tech Studio, LLC. If anything here is unclear,
write to <a href="mailto:${L.email}">${L.email}</a>.</p>

<h2>What the app stores</h2>

<h3>On your device</h3>
<ul>
  <li><b>A library key</b> — sixteen random characters generated on your device
  the first time you open the app. It is kept in the system keychain (iOS) or
  keystore (Android). It is not linked to you, your phone, or any account: it
  simply says “this library is mine”.</li>
  <li><b>The nickname you type</b> and your chosen interface language.</li>
</ul>

<h3>On our servers</h3>
<ul>
  <li><b>The stories themselves</b> — the text, the choices made, and the setup
  you gave (genre, language, reading level, any characters or scene you typed).</li>
  <li><b>The nickname each player chose</b>, so everyone can see whose turn it
  is. You can type anything here; it does not have to be a real name, and we
  would rather it wasn’t a child’s full one.</li>
  <li><b>A one-way hash of your library key</b> — never the key itself. A copy of
  our database could not be used to open anyone’s library.</li>
  <li><b>How many twists you have left</b>, and any purchases, against that hash.</li>
</ul>

<h3>What we do not store</h3>
<p>No email addresses, no passwords, no phone numbers, no contacts, no location,
no advertising identifiers, no device fingerprints. The app contains no analytics
or tracking SDK of any kind.</p>

<h2>How long things last</h2>
<ul>
  <li>A story nobody has touched for <b>30 days</b> is deleted automatically.</li>
  <li>A story you <b>keep</b> stays in your library until you delete it. Deleting
  it removes it from our servers.</li>
  <li>Losing your library key means losing access to that library. We cannot
  recover it — we do not know who it belonged to. That is the cost of having no
  accounts, and it is deliberate.</li>
</ul>

<h2>Who else sees this</h2>
<p>Writing a story means sending it to a language model. We use these providers,
and only for the feature named:</p>
<ul>
  <li><b>Google</b> — text-to-speech, for the “read aloud” button. The passage
  being read is sent; the audio comes back. It is not used to train anything.</li>
  <li><b>Google (Gemini)</b> — writing the story, explaining a word, and
  translating character descriptions. It receives the story so far and the setup
  you gave. Your stories are not used to train it.</li>
  <li><b>Supabase</b> — our database and server hosting.</li>
</ul>
<p>These providers process data on our behalf under their own terms. We do not
send them your library key, your balance, or anything identifying you.</p>
<p>If we ever change which model writes the stories, we will update this page and
say so in the app. We will not quietly add a provider that receives your stories.</p>

<h2>Children</h2>
<p>Capy’s Plotopia is made for families to use together, and an adult sets up the
story. Because we collect no personal information from anyone, we collect none
from children either. There is no chat, no messaging between strangers, and no
way to find or contact another player: a story is joined only by a code that
someone reads out to you.</p>
<p>Stories are written by a language model. We instruct it to write for the
audience and reading level chosen, but as with any such system, we cannot promise
every sentence will suit every family. We suggest an adult stays nearby,
particularly with younger children.</p>

<h2>Playing in a browser</h2>
<p>The web version stores your nickname and interface language in your browser.
If you type a library key there, it is held only until you close the window — it
is never saved to the browser and never put in a link.</p>

<h2>Payments</h2>
<p>Twists are bought through Apple or Google. We never see your card details.
We record only that a purchase happened and how many twists to add.</p>

<h2>Your choices</h2>
<ul>
  <li>Delete any kept story from <i>My library</i> at any time.</li>
  <li>Leave a story and your nickname is removed from it.</li>
  <li>Delete the app to remove the library key from your device. Tell us if you
  would like the matching server data removed too — send the library key from
  the app’s key panel and we will delete everything held against it.</li>
</ul>

<h2>Changes</h2>
<p>If this policy changes in a way that matters, we will say so in the app rather
than quietly editing this page.</p>
`},

<h1>Datenschutzrichtlinie</h1>
<p class="lead">Capy’s Plotopia · zuletzt aktualisiert am 4. August 2026</p>

<div class="note">
  <p><b>Die Kurzfassung.</b> Es gibt keine Konten. Wir fragen nie nach deinem Namen,

// The app's own codes are zh-CN / zh-TW / pt; the rest of this website uses
// zh-Hans / zh-Hant / pt-BR. Accept both, so a ?lang= link from either side
// lands on the right policy instead of silently falling back to English.
var ALIAS = { 'zh-Hans':'zh-CN', 'zh-Hant':'zh-TW', 'pt-BR':'pt-BR', 'pt-PT':'pt-BR' };

function resolveLang(code) {
  if (!code) return 'en';
  if (POLICIES[code]) return code;
  if (ALIAS[code] && POLICIES[ALIAS[code]]) return ALIAS[code];
  var base = code.split('-')[0].toLowerCase();
  if (base === 'zh') return /hant|tw|hk|mo/i.test(code) ? 'zh-TW' : 'zh-CN';
  if (base === 'pt') return 'pt-BR';
  if (POLICIES[base]) return base;
  return 'en';
}

function render(lang) {
  var p = POLICIES[lang] || POLICIES['en'];
  document.getElementById('content').innerHTML = p.html;
  document.documentElement.lang = lang;
  document.body.setAttribute('dir', p.dir === 'rtl' ? 'rtl' : 'ltr');
  var sel = document.getElementById('langsel');
  if (sel) sel.value = lang;
  // Carry the choice to the Terms page and back to the Plotopia page.
  document.querySelectorAll('a[href^="terms.html"]').forEach(function (a) {
    a.href = 'terms.html?lang=' + encodeURIComponent(lang);
  });
  try { localStorage.setItem('wr_lang', lang); } catch (e) {}
}

(function () {
  var bar = document.getElementById('langbar');
  var sel = document.createElement('select');
  sel.id = 'langsel';
  sel.setAttribute('aria-label', 'Choose language');
  Object.keys(POLICIES).forEach(function (code) {
    var o = document.createElement('option');
    o.value = code;
    o.textContent = POLICIES[code].label;
    sel.appendChild(o);
  });
  sel.addEventListener('change', function () { render(sel.value); });
  bar.appendChild(sel);
  var params = new URLSearchParams(window.location.search);
  var initial = resolveLang(params.get('lang'));
  if (!params.get('lang')) {
    try {
      var saved = localStorage.getItem('wr_lang');
      initial = (saved && resolveLang(saved)) || resolveLang(navigator.language || 'en');
    } catch (e) { initial = 'en'; }
  }
  render(initial);
})();
</script>

<script src="../assets/theme.js"></script>
</body>
</html>
